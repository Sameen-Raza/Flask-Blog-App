{% extends "base.html" %}
{% block title %}Edit Post - My Blog{% endblock %}

{% block content %}
<h2>Edit Post</h2>
<form method="POST" action="{{ url_for('edit', id=post.id) }}">
  <div class="mb-3">
    <label for="title" class="form-label">Title</label>
    <input type="text" class="form-control" id="title" name="title" value="{{ post.title }}" required>
  </div>
  <div class="mb-3">
    <label for="content" class="form-label">Content</label>
    <textarea class="form-control" id="content" name="content" rows="6" required>{{ post.content }}</textarea>
  </div>
  <div style="display: flex; gap: 10px; margin-top: 10px;">
  <button type="submit" class="btn btn-primary">Update</button>
  <a href="{{ url_for('post', id=post.id) }}" class="btn btn-secondary">Cancel</a>
</div>
</form>
{% endblock %}
